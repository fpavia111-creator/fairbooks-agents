name: test
on:
  push: { branches: [main, master] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm test
      - name: Evals (every agent)
        shell: bash
        run: |
          for p in packages/*/; do n=$(basename "$p"); [ "$n" = fairbooks-core ] && continue
            (cd "$p" && node "bin/$n.js" eval) || exit 1; done
      - name: Hostile inputs (planted formulas, HTML, path tricks and AI-directed text in every agent's data)
        run: npm run hostile
      - name: Pack contents stay clean
        shell: bash
        # The file list is piped to node on stdin: no /tmp path, which Git Bash and node read
        # differently on Windows (/tmp vs C:\tmp), the cause of the 0.2.0 Windows failure.
        run: |
          for p in packages/*/; do (cd "$p" && npm pack --dry-run --json --ignore-scripts | PKG="$p" node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
            const f=JSON.parse(s)[0].files.map(x=>x.path.split('\\\\').join('/'));
            const bad=f.filter(x=>/(^|\/)(node_modules|\.fairbooks|fairbooks-out)\/|\.npmrc$|\.tgz$/.test(x));
            if(bad.length){console.error(process.env.PKG, bad);process.exit(1)}
            console.log(process.env.PKG, f.length, 'files ok')})") || exit 1; done
